name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Lint & Validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Validate HTML templates
        run: |
          find templates/ -name "*.html" | while read f; do
            if ! grep -q '<!DOCTYPE html>' "$f"; then echo "FAIL: Missing DOCTYPE in $f"; exit 1; fi
            echo "OK: $f"
          done
      - name: Validate CSS tokens
        run: |
          find tokens/ -name "*.css" | while read f; do
            grep -q "var(" "$f" && echo "OK: $f" || echo "Warning: No CSS vars in $f"
          done
      - name: Validate JS modules
        run: |
          find animations/ -name "*.js" | while read f; do
            node --check "$f" && echo "OK: $f"
          done
      - name: Validate SKILL.md frontmatter
        run: |
          grep -q "^---$" SKILL.md && echo "OK: SKILL.md has YAML frontmatter" || (echo "FAIL: Missing frontmatter"; exit 1)
      - name: Check file structure
        run: |
          for dir in templates tokens animations references docs; do
            [ -d "$dir" ] && echo "OK: $dir/" || (echo "FAIL: Missing $dir"; exit 1)
          done

  build-test:
    name: Build Test
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Run tests
        run: |
          npm install --save-dev jest jsdom
          npx jest tests/

  lighthouse-ci:
    name: Lighthouse CI
    runs-on: ubuntu-latest
    needs: build-test
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install Lighthouse CI
        run: npm install -g @lhci/cli@0.13
      - name: Start static server
        run: npx http-server . -p 9876 -s &
      - name: Wait for server
        run: sleep 2
      - name: Run Lighthouse CI
        run: lhci autorun --collect.url=http://localhost:9876/templates/layouts/bento.html --collect.numberOfRuns=1 --upload.target=temporary-public-storage || true
        continue-on-error: true
      - name: Upload results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lighthouse-results
          path: .lighthouseci/

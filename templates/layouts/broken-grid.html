<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Broken Grid Layout — toti-web-design-skill</title>
  <link rel="stylesheet" href="../../tokens/base.css">
  <link rel="stylesheet" href="../../tokens/dark.css">
  <link rel="stylesheet" href="../../tokens/fluid-type.css">
  <link rel="stylesheet" href="../../tokens/fluid-spacing.css">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: var(--font-body); background: var(--color-bg); color: var(--color-text); line-height: var(--leading-body); -webkit-font-smoothing: antialiased; overflow-x: hidden; }
    .broken-grid { position: relative; max-width: var(--container-max); margin: 0 auto; padding: var(--padding-section); display: grid; grid-template-columns: repeat(12, 1fr); gap: var(--grid-gap); }
    .broken-grid__item { position: relative; }
    .broken-grid__item--1 { grid-column: 1 / 8; z-index: 2; }
    .broken-grid__item--2 { grid-column: 6 / 13; margin-top: -15vh; z-index: 1; }
    .broken-grid__item--3 { grid-column: 2 / 7; margin-top: -10vh; z-index: 3; }
    .broken-grid__title { font-family: var(--font-display); font-size: var(--font-size-display); line-height: var(--leading-display); letter-spacing: var(--tracking-display); font-weight: var(--weight-bold); }
    .broken-grid__image { width: 100%; height: 60vh; background: var(--color-surface); border-radius: var(--radius-lg); overflow: hidden; }
    .broken-grid__image img { width: 100%; height: 100%; object-fit: cover; }
    .broken-grid__text { font-size: var(--font-size-xl); line-height: var(--leading-subheading); max-width: 40ch; color: var(--color-text-muted); }
    @media (max-width: 768px) { .broken-grid__item--1, .broken-grid__item--2, .broken-grid__item--3 { grid-column: 1 / 13; margin-top: 0; } .broken-grid__image { height: 40vh; } }
  </style>
</head>
<body>
  <section class="broken-grid">
    <div class="broken-grid__item broken-grid__item--1"><h1 class="broken-grid__title" data-text-reveal="words">Broken Grid</h1></div>
    <div class="broken-grid__item broken-grid__item--2"><div class="broken-grid__image" data-image-reveal="clip"><img src="https://picsum.photos/1200/800" alt="Broken grid visual"></div></div>
    <div class="broken-grid__item broken-grid__item--3"><p class="broken-grid__text" data-reveal="up">Elements break free of the column grid. Overlap, offset, and negative margins create depth.</p></div>
  </section>
  <script src="../../animations/scroll-driven.js"></script>
  <script src="../../animations/text-reveal.js"></script>
  <script src="../../animations/image-reveal.js"></script>
</body>
</html>

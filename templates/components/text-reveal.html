<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Text Reveal — toti-web-design-skill</title>
  <link rel="stylesheet" href="../../tokens/base.css">
  <link rel="stylesheet" href="../../tokens/dark.css">
  <link rel="stylesheet" href="../../tokens/fluid-type.css">
  <link rel="stylesheet" href="../../tokens/fluid-spacing.css">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: var(--font-body); background: var(--color-bg); color: var(--color-text); -webkit-font-smoothing: antialiased; }
    .container { max-width: var(--container-max); margin: 0 auto; padding: var(--padding-section); display: flex; flex-direction: column; gap: var(--space-3xl); }
    h1, h2 { font-family: var(--font-display); font-weight: var(--weight-bold); }
    h1 { font-size: var(--font-size-5xl); line-height: var(--leading-heading); letter-spacing: var(--tracking-heading); }
    h2 { font-size: var(--font-size-3xl); line-height: var(--leading-heading); letter-spacing: var(--tracking-heading); }
    p { font-size: var(--font-size-lg); color: var(--color-text-muted); max-width: 60ch; }
  </style>
</head>
<body>
  <div class="container">
    <section>
      <h1 data-text-reveal="words">Words Reveal on Scroll</h1>
      <p data-text-reveal="words" data-text-stagger="30" data-reveal-delay="400">Each word slides up from below, staggered by 30ms. The mask effect creates a clean entrance.</p>
    </section>
    <section>
      <h2 data-text-reveal="chars" data-text-stagger="15">Character Stagger</h2>
      <p data-reveal="up" data-reveal-delay="300">Characters reveal individually with a rotation. Best for shorter headings.</p>
    </section>
    <section>
      <h2 data-text-reveal="lines">Line by Line</h2>
      <p data-reveal="up" data-reveal-delay="300">Multi-line text reveals line by line, each masked in its own container.</p>
    </section>
  </div>
  <script src="../../animations/scroll-driven.js"></script>
  <script src="../../animations/text-reveal.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Immersive Hero</title>
  <link rel="stylesheet" href="../tokens/design-tokens.css">
  <link rel="stylesheet" href="../tokens/themes.css">
  <link rel="stylesheet" href="../tokens/fluid-typography.css">
  <link rel="stylesheet" href="../animations/image-reveal.css">
  <style>
    .hero {
      position: relative;
      width: 100%;
      height: 100vh;
      min-height: 600px;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .hero__bg {
      position: absolute;
      inset: 0;
      z-index: 0;
    }
    .hero__bg img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      opacity: 0.4;
    }
    .hero__bg::after {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(180deg, rgba(10,10,10,0.6) 0%, var(--color-bg) 100%);
    }
    .hero__content {
      position: relative;
      z-index: 1;
      text-align: center;
      padding: var(--padding-page);
      max-width: 900px;
    }
    .hero__label {
      font-size: var(--font-size-sm);
      letter-spacing: var(--tracking-widest);
      text-transform: uppercase;
      color: var(--color-accent);
      margin-bottom: var(--space-md);
      opacity: 0;
      animation: hero-fade 0.8s var(--ease-expo) 0.2s forwards;
    }
    .hero__title {
      font-size: var(--font-size-display);
      line-height: var(--leading-hero);
      letter-spacing: var(--tracking-hero);
      font-weight: var(--weight-black);
      margin-bottom: var(--space-md);
      opacity: 0;
      animation: hero-fade 1s var(--ease-expo) 0.4s forwards;
    }
    .hero__subtitle {
      font-size: var(--font-size-xl);
      color: var(--color-text-muted);
      max-width: 50ch;
      margin: 0 auto var(--space-xl);
      opacity: 0;
      animation: hero-fade 1s var(--ease-expo) 0.6s forwards;
    }
    .hero__cta {
      display: inline-flex;
      align-items: center;
      gap: 0.5em;
      padding: 1rem 2.5rem;
      font-size: var(--font-size-base);
      font-weight: var(--weight-semibold);
      color: var(--color-bg);
      background: var(--color-cta);
      border: none;
      border-radius: var(--radius-full);
      cursor: pointer;
      opacity: 0;
      animation: hero-fade 1s var(--ease-expo) 0.8s forwards;
      transition: transform 0.3s var(--ease-smooth), box-shadow 0.3s ease;
    }
    .hero__cta:hover {
      transform: translateY(-2px);
      box-shadow: var(--shadow-glow-cta);
    }
    .hero__scroll {
      position: absolute;
      bottom: var(--space-xl);
      left: 50%;
      transform: translateX(-50%);
      font-size: var(--font-size-xs);
      letter-spacing: var(--tracking-wider);
      text-transform: uppercase;
      color: var(--color-text-dim);
      opacity: 0;
      animation: hero-fade 1s var(--ease-expo) 1s forwards, scroll-bounce 2s ease-in-out 2s infinite;
    }
    @keyframes hero-fade {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }
    @keyframes scroll-bounce {
      0%, 100% { transform: translateX(-50%) translateY(0); }
      50% { transform: translateX(-50%) translateY(8px); }
    }
    @media (prefers-reduced-motion: reduce) {
      .hero__label, .hero__title, .hero__subtitle, .hero__cta, .hero__scroll {
        opacity: 1 !important;
        animation: none !important;
      }
    }
  </style>
</head>
<body>
  <section class="hero">
    <div class="hero__bg">
      <img src="https://picsum.photos/1920/1080" alt="" loading="eager">
    </div>
    <div class="hero__content">
      <p class="hero__label">Award-Winning Web Design</p>
      <h1 class="hero__title">Build the<br>extraordinary</h1>
      <p class="hero__subtitle">A complete design system, animation library, and reference catalog inspired by 100+ awwwards.com winners.</p>
      <button class="hero__cta" data-magnetic data-magnetic-strength="0.3">
        Get Started
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
      </button>
    </div>
    <p class="hero__scroll">Scroll</p>
  </section>
  <script src="../animations/magnetic-cursor.js"></script>
</body>
</html>

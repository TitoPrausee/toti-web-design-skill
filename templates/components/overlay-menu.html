<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Overlay Menu</title>
  <link rel="stylesheet" href="../tokens/design-tokens.css">
  <link rel="stylesheet" href="../tokens/themes.css">
  <style>
    .nav-trigger {
      position: fixed; top: var(--space-md); right: var(--space-md); z-index: 100;
      display: flex; flex-direction: column; gap: 5px; padding: 12px;
      background: none; border: none; cursor: pointer;
    }
    .nav-trigger__line {
      width: 28px; height: 2px; background: var(--color-text);
      transition: transform 0.3s var(--ease-smooth), opacity 0.2s ease;
    }
    .nav-trigger[aria-expanded="true"] .nav-trigger__line:nth-child(1) { transform: translateY(7px) rotate(45deg); }
    .nav-trigger[aria-expanded="true"] .nav-trigger__line:nth-child(2) { opacity: 0; }
    .nav-trigger[aria-expanded="true"] .nav-trigger__line:nth-child(3) { transform: translateY(-7px) rotate(-45deg); }
    .nav-trigger:focus-visible { outline: 2px solid var(--color-accent); outline-offset: 4px; }

    .overlay-menu {
      position: fixed; inset: 0; z-index: 99;
      display: flex; flex-direction: column; justify-content: center; align-items: flex-start;
      padding: var(--space-3xl) var(--space-2xl);
      background: var(--color-bg);
      transform: translateY(-100%);
      transition: transform 0.6s var(--ease-power);
      visibility: hidden;
    }
    .overlay-menu.is-open { transform: translateY(0); visibility: visible; }
    .overlay-menu__list { list-style: none; padding: 0; margin: 0; }
    .overlay-menu__item { overflow: hidden; margin-bottom: var(--space-sm); }
    .overlay-menu__link {
      display: inline-block; font-size: clamp(2.5rem, 8vw, 5rem);
      font-weight: var(--weight-black); line-height: 1.1; color: var(--color-text);
      text-decoration: none; letter-spacing: var(--tracking-display);
      transform: translateY(100%); transition: transform 0.5s var(--ease-expo), color 0.3s ease;
    }
    .overlay-menu.is-open .overlay-menu__link { transform: translateY(0); }
    .overlay-menu.is-open .overlay-menu__item:nth-child(1) .overlay-menu__link { transition-delay: 0.1s; }
    .overlay-menu.is-open .overlay-menu__item:nth-child(2) .overlay-menu__link { transition-delay: 0.15s; }
    .overlay-menu.is-open .overlay-menu__item:nth-child(3) .overlay-menu__link { transition-delay: 0.2s; }
    .overlay-menu.is-open .overlay-menu__item:nth-child(4) .overlay-menu__link { transition-delay: 0.25s; }
    .overlay-menu.is-open .overlay-menu__item:nth-child(5) .overlay-menu__link { transition-delay: 0.3s; }
    .overlay-menu__link:hover { color: var(--color-accent); }
    .overlay-menu__footer {
      position: absolute; bottom: var(--space-xl); left: var(--space-2xl);
      font-size: var(--font-size-sm); color: var(--color-text-dim);
    }
    @media (prefers-reduced-motion: reduce) {
      .overlay-menu { transform: none; transition: opacity 0.2s; }
      .overlay-menu:not(.is-open) { opacity: 0; }
      .overlay-menu__link { transform: none !important; }
      .nav-trigger__line { transition: none; }
    }
  </style>
</head>
<body>
  <button class="nav-trigger" aria-label="Toggle menu" aria-expanded="false" aria-controls="overlay-menu">
    <span class="nav-trigger__line"></span>
    <span class="nav-trigger__line"></span>
    <span class="nav-trigger__line"></span>
  </button>
  <nav class="overlay-menu" id="overlay-menu" aria-hidden="true">
    <ul class="overlay-menu__list">
      <li class="overlay-menu__item"><a href="#" class="overlay-menu__link">Home</a></li>
      <li class="overlay-menu__item"><a href="#" class="overlay-menu__link">Work</a></li>
      <li class="overlay-menu__item"><a href="#" class="overlay-menu__link">About</a></li>
      <li class="overlay-menu__item"><a href="#" class="overlay-menu__link">Journal</a></li>
      <li class="overlay-menu__item"><a href="#" class="overlay-menu__link">Contact</a></li>
    </ul>
    <div class="overlay-menu__footer"><p>hello@example.com</p></div>
  </nav>
  <script>
    const trigger = document.querySelector('.nav-trigger');
    const menu = document.querySelector('.overlay-menu');
    const links = menu.querySelectorAll('.overlay-menu__link');
    function toggleMenu(open) {
      const isOpen = open ?? !menu.classList.contains('is-open');
      trigger.setAttribute('aria-expanded', isOpen);
      menu.setAttribute('aria-hidden', !isOpen);
      menu.classList.toggle('is-open', isOpen);
      document.body.style.overflow = isOpen ? 'hidden' : '';
    }
    trigger.addEventListener('click', () => toggleMenu());
    links.forEach(l => l.addEventListener('click', () => toggleMenu(false)));
    document.addEventListener('keydown', e => {
      if (e.key === 'Escape' && menu.classList.contains('is-open')) { toggleMenu(false); trigger.focus(); }
    });
  </script>
</body>
</html>

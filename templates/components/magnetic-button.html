<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Magnetic Button — toti-web-design-skill</title>
  <link rel="stylesheet" href="../../tokens/base.css">
  <link rel="stylesheet" href="../../tokens/dark.css">
  <link rel="stylesheet" href="../../tokens/fluid-type.css">
  <link rel="stylesheet" href="../../tokens/fluid-spacing.css">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: var(--font-body); background: var(--color-bg); color: var(--color-text); display: flex; align-items: center; justify-content: center; min-height: 100vh; gap: var(--space-lg); flex-wrap: wrap; -webkit-font-smoothing: antialiased; }
    .btn-magnetic { position: relative; display: inline-flex; align-items: center; gap: var(--space-2xs); padding: var(--space-sm) var(--space-xl); font-family: var(--font-body); font-size: var(--font-size-base); font-weight: var(--weight-medium); color: var(--color-text-primary); background: transparent; border: 1px solid var(--color-border-strong); border-radius: var(--radius-full); cursor: pointer; overflow: hidden; transition: color var(--transition-base), border-color var(--transition-base); will-change: transform; }
    .btn-magnetic::before { content: ''; position: absolute; inset: 0; background: var(--color-accent); border-radius: var(--radius-full); transform: scale(0); transition: transform var(--transition-spring); z-index: -1; }
    .btn-magnetic:hover { color: var(--color-text-inverse); border-color: var(--color-accent); }
    .btn-magnetic:hover::before { transform: scale(1); }
    .btn-cta { padding: var(--space-sm) var(--space-xl); font-size: var(--font-size-base); font-weight: var(--weight-semibold); color: var(--color-text-inverse); background: var(--color-cta); border: none; border-radius: var(--radius-full); cursor: pointer; will-change: transform; transition: box-shadow var(--transition-base); }
    .btn-cta:hover { box-shadow: var(--shadow-glow); }
    .btn-ghost { display: inline-flex; align-items: center; gap: var(--space-2xs); padding: var(--space-2xs) 0; font-size: var(--font-size-base); font-weight: var(--weight-medium); color: var(--color-text); background: none; border: none; cursor: pointer; will-change: transform; position: relative; }
    .btn-ghost::after { content: ''; position: absolute; bottom: 0; left: 0; width: 100%; height: 1px; background: var(--color-text); transform: scaleX(0); transform-origin: right; transition: transform var(--transition-smooth); }
    .btn-ghost:hover::after { transform: scaleX(1); transform-origin: left; }
  </style>
</head>
<body>
  <button class="btn-magnetic" data-magnetic data-magnetic-strength="0.4">Magnetic Outline</button>
  <button class="btn-cta" data-magnetic data-magnetic-strength="0.3">CTA</button>
  <button class="btn-ghost" data-magnetic data-magnetic-strength="0.2">Ghost Link</button>
  <script src="../../animations/magnetic-cursor.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Image Reveal — toti-web-design-skill</title>
  <link rel="stylesheet" href="../../tokens/base.css">
  <link rel="stylesheet" href="../../tokens/dark.css">
  <link rel="stylesheet" href="../../tokens/fluid-type.css">
  <link rel="stylesheet" href="../../tokens/fluid-spacing.css">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: var(--font-body); background: var(--color-bg); color: var(--color-text); -webkit-font-smoothing: antialiased; }
    .gallery { max-width: var(--container-max); margin: 0 auto; padding: var(--padding-section); display: grid; grid-template-columns: repeat(2, 1fr); gap: var(--space-lg); }
    .gallery__item { width: 100%; height: 50vh; background: var(--color-surface); border-radius: var(--radius-lg); overflow: hidden; }
    .gallery__item img { width: 100%; height: 100%; object-fit: cover; display: block; will-change: transform; }
    .gallery__label { grid-column: 1 / -1; font-family: var(--font-display); font-size: var(--font-size-3xl); font-weight: var(--weight-bold); letter-spacing: var(--tracking-heading); }
    @media (max-width: 768px) { .gallery { grid-template-columns: 1fr; } .gallery__item { height: 35vh; } }
  </style>
</head>
<body>
  <div class="gallery">
    <div class="gallery__label" data-text-reveal="words">Image Reveal Patterns</div>
    <div class="gallery__item" data-image-reveal="clip"><img src="https://picsum.photos/800/600?1" alt="Clip reveal"></div>
    <div class="gallery__item" data-image-reveal="scale" data-reveal-delay="100"><img src="https://picsum.photos/800/600?2" alt="Scale reveal"></div>
    <div class="gallery__item" data-image-reveal="mask" data-reveal-delay="200"><img src="https://picsum.photos/800/600?3" alt="Mask reveal"></div>
    <div class="gallery__item" data-image-reveal="fade" data-reveal-delay="300"><img src="https://picsum.photos/800/600?4" alt="Fade reveal"></div>
  </div>
  <script src="../../animations/image-reveal.js"></script>
  <script src="../../animations/text-reveal.js"></script>
</body>
</html>

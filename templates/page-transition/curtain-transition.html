<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Page Transition — toti-web-design-skill</title>
  <link rel="stylesheet" href="../../tokens/base.css">
  <link rel="stylesheet" href="../../tokens/dark.css">
  <link rel="stylesheet" href="../../tokens/fluid-type.css">
  <link rel="stylesheet" href="../../tokens/fluid-spacing.css">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: var(--font-body); background: var(--color-bg); color: var(--color-text); -webkit-font-smoothing: antialiased; }
    .transition-overlay { position: fixed; inset: 0; background: var(--color-accent); z-index: var(--z-modal); transform: translateY(-100%); pointer-events: none; }
    .transition-overlay.is-active { animation: transitionSlide 800ms cubic-bezier(0.77, 0, 0.175, 1) forwards; }
    @keyframes transitionSlide { 0% { transform: translateY(-100%); } 50% { transform: translateY(0); } 100% { transform: translateY(100%); } }
    main { min-height: 100vh; display: flex; align-items: center; justify-content: center; flex-direction: column; gap: var(--space-xl); padding: var(--container-padding); }
    h1 { font-family: var(--font-display); font-size: var(--font-size-5xl); font-weight: var(--weight-bold); letter-spacing: var(--tracking-heading); }
    p { font-size: var(--font-size-lg); color: var(--color-text-muted); max-width: 50ch; text-align: center; }
    .links { display: flex; gap: var(--space-md); flex-wrap: wrap; justify-content: center; }
    .links a { display: inline-flex; align-items: center; gap: var(--space-2xs); padding: var(--space-sm) var(--space-lg); font-size: var(--font-size-base); font-weight: var(--weight-medium); color: var(--color-text); text-decoration: none; border: 1px solid var(--color-border-strong); border-radius: var(--radius-full); transition: background var(--transition-base), color var(--transition-base); }
    .links a:hover { background: var(--color-text-primary); color: var(--color-text-inverse); }
  </style>
</head>
<body>
  <div class="transition-overlay" id="overlay"></div>
  <main data-page-transition-in="fade">
    <h1 data-text-reveal="words">Page Transitions</h1>
    <p>Click a link below to see the transition overlay slide in from the top, cover the screen, and slide out the bottom.</p>
    <div class="links">
      <a href="#" data-transition="curtain">Curtain</a>
      <a href="#" data-transition="fade">Fade</a>
      <a href="#" data-transition="slide">Slide</a>
      <a href="#" data-transition="scale">Scale</a>
    </div>
  </main>
  <script>
    const overlay = document.getElementById('overlay');
    document.querySelectorAll('[data-transition]').forEach((link) => {
      link.addEventListener('click', (e) => {
        e.preventDefault();
        const type = link.dataset.transition;
        if (type === 'curtain') {
          overlay.classList.add('is-active');
          setTimeout(() => overlay.classList.remove('is-active'), 800);
        } else {
          const main = document.querySelector('main');
          main.style.transition = 'opacity 400ms ease, transform 400ms ease';
          main.style.opacity = '0';
          main.style.transform = type === 'slide' ? 'translateX(-50px)' : type === 'scale' ? 'scale(0.95)' : '';
          setTimeout(() => { main.style.opacity = '1'; main.style.transform = ''; }, 400);
        }
      });
    });
  </script>
  <script src="../../animations/text-reveal.js"></script>
</body>
</html>

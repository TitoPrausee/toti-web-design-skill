<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fullscreen Overlay Menu — toti-web-design-skill</title>
  <link rel="stylesheet" href="../../tokens/base.css">
  <link rel="stylesheet" href="../../tokens/dark.css">
  <link rel="stylesheet" href="../../tokens/fluid-type.css">
  <link rel="stylesheet" href="../../tokens/fluid-spacing.css">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: var(--font-body); background: var(--color-bg); color: var(--color-text); min-height: 100vh; -webkit-font-smoothing: antialiased; }
    .menu-trigger { position: fixed; top: var(--space-lg); right: var(--space-lg); z-index: var(--z-modal); display: flex; flex-direction: column; gap: 5px; padding: var(--space-2xs); background: var(--glass-bg); backdrop-filter: blur(var(--glass-blur)); -webkit-backdrop-filter: blur(var(--glass-blur)); border: 1px solid var(--glass-border); border-radius: var(--radius-md); cursor: pointer; }
    .menu-trigger span { display: block; width: 24px; height: 2px; background: var(--color-text-primary); transition: transform var(--transition-base), opacity var(--transition-base); }
    .menu-trigger.is-open span:nth-child(1) { transform: translateY(7px) rotate(45deg); }
    .menu-trigger.is-open span:nth-child(2) { opacity: 0; }
    .menu-trigger.is-open span:nth-child(3) { transform: translateY(-7px) rotate(-45deg); }
    .nav-overlay { position: fixed; inset: 0; background: var(--color-bg); z-index: var(--z-overlay); display: flex; align-items: center; justify-content: center; clip-path: circle(0% at 100% 0%); transition: clip-path 600ms cubic-bezier(0.77, 0, 0.175, 1); }
    .nav-overlay.is-open { clip-path: circle(150% at 100% 0%); }
    .nav-overlay__list { list-style: none; display: flex; flex-direction: column; gap: var(--space-xs); }
    .nav-overlay__link { font-family: var(--font-display); font-size: var(--font-size-4xl); font-weight: var(--weight-bold); line-height: var(--leading-heading); letter-spacing: var(--tracking-heading); color: var(--color-text); text-decoration: none; display: inline-block; opacity: 0; transform: translateY(30px); transition: opacity 400ms ease, transform 400ms cubic-bezier(0.22, 1, 0.36, 1); }
    .nav-overlay.is-open .nav-overlay__link { opacity: 1; transform: translateY(0); }
    .nav-overlay.is-open .nav-overlay__link:nth-child(1) { transition-delay: 200ms; }
    .nav-overlay.is-open .nav-overlay__link:nth-child(2) { transition-delay: 280ms; }
    .nav-overlay.is-open .nav-overlay__link:nth-child(3) { transition-delay: 360ms; }
    .nav-overlay.is-open .nav-overlay__link:nth-child(4) { transition-delay: 440ms; }
    .nav-overlay.is-open .nav-overlay__link:nth-child(5) { transition-delay: 520ms; }
    .nav-overlay__link:hover { color: var(--color-accent); transform: translateX(10px); }
    .nav-overlay__social { position: absolute; bottom: var(--space-2xl); left: var(--container-padding); display: flex; gap: var(--space-md); }
    .nav-overlay__social a { font-size: var(--font-size-sm); color: var(--color-text-muted); text-decoration: none; transition: color var(--transition-base); }
    .nav-overlay__social a:hover { color: var(--color-text-primary); }
    .content { padding: var(--padding-section); max-width: var(--container-max); }
  </style>
</head>
<body>
  <button class="menu-trigger" id="menuTrigger" aria-label="Toggle menu"><span></span><span></span><span></span></button>
  <nav class="nav-overlay" id="navOverlay">
    <ul class="nav-overlay__list">
      <li><a href="#" class="nav-overlay__link" data-magnetic data-magnetic-strength="0.15">Home</a></li>
      <li><a href="#" class="nav-overlay__link" data-magnetic data-magnetic-strength="0.15">Work</a></li>
      <li><a href="#" class="nav-overlay__link" data-magnetic data-magnetic-strength="0.15">About</a></li>
      <li><a href="#" class="nav-overlay__link" data-magnetic data-magnetic-strength="0.15">Journal</a></li>
      <li><a href="#" class="nav-overlay__link" data-magnetic data-magnetic-strength="0.15">Contact</a></li>
    </ul>
    <div class="nav-overlay__social"><a href="#">Instagram</a><a href="#">Twitter</a><a href="#">GitHub</a></div>
  </nav>
  <main class="content">
    <h1 data-text-reveal="words" style="font-family: var(--font-display); font-size: var(--font-size-5xl); font-weight: var(--weight-bold);">Fullscreen Overlay Menu</h1>
    <p style="margin-top: var(--space-md); color: var(--color-text-muted); font-size: var(--font-size-lg); max-width: 50ch;">Click the menu button. The overlay opens with a circular clip-path reveal. Links stagger in with a delay.</p>
  </main>
  <script>
    const trigger = document.getElementById('menuTrigger');
    const overlay = document.getElementById('navOverlay');
    trigger.addEventListener('click', () => {
      trigger.classList.toggle('is-open');
      overlay.classList.toggle('is-open');
      document.body.style.overflow = overlay.classList.contains('is-open') ? 'hidden' : '';
    });
  </script>
  <script src="../../animations/text-reveal.js"></script>
  <script src="../../animations/magnetic-cursor.js"></script>
</body>
</html>

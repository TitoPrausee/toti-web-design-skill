<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GSAP Scroll Timeline — toti-web-design-skill</title>
  <link rel="stylesheet" href="../../tokens/base.css">
  <link rel="stylesheet" href="../../tokens/dark.css">
  <link rel="stylesheet" href="../../tokens/fluid-type.css">
  <link rel="stylesheet" href="../../tokens/fluid-spacing.css">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: var(--font-body); background: var(--color-bg); color: var(--color-text); -webkit-font-smoothing: antialiased; }
    .panel { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: var(--container-padding); flex-direction: column; gap: var(--space-md); }
    .panel h1, .panel h2 { font-family: var(--font-display); font-weight: var(--weight-bold); letter-spacing: var(--tracking-heading); }
    .panel h1 { font-size: var(--font-size-display); line-height: var(--leading-display); letter-spacing: var(--tracking-display); }
    .panel h2 { font-size: var(--font-size-4xl); line-height: var(--leading-heading); }
    .panel p { font-size: var(--font-size-lg); color: var(--color-text-muted); max-width: 50ch; text-align: center; }
    .pin-section { height: 300vh; position: relative; }
    .pin-content { position: sticky; top: 0; height: 100vh; display: flex; align-items: center; justify-content: center; overflow: hidden; }
    .pin-box { width: 300px; height: 300px; background: var(--color-accent); border-radius: var(--radius-lg); will-change: transform, border-radius; }
  </style>
</head>
<body>
  <section class="panel"><h1>GSAP ScrollTrigger</h1><p>Scroll down to see the pinned section animate with scroll progress.</p></section>
  <section class="pin-section"><div class="pin-content"><div class="pin-box" id="pinBox"></div></div></section>
  <section class="panel"><h2>Timeline Complete</h2><p>The box morphed from a square to a circle, rotated, and scaled — all driven by scroll position.</p></section>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/ScrollTrigger.min.js"></script>
  <script>
    gsap.registerPlugin(ScrollTrigger);
    const prefersReducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    if (!prefersReducedMotion) {
      gsap.timeline({ scrollTrigger: { trigger: '.pin-section', start: 'top top', end: 'bottom bottom', scrub: 1 } })
        .to('#pinBox', { rotation: 180, scale: 0.5, borderRadius: '50%', backgroundColor: '#00fe40', ease: 'none' })
        .to('#pinBox', { rotation: 360, scale: 1, borderRadius: '16px', backgroundColor: '#578bfc', ease: 'none' });
      gsap.utils.toArray('.panel').forEach((panel) => {
        gsap.from(panel.children, { opacity: 0, y: 50, duration: 1, stagger: 0.15, ease: 'power3.out', scrollTrigger: { trigger: panel, start: 'top 80%' } });
      });
    }
  </script>
</body>
</html>

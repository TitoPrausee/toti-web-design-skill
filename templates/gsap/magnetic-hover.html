<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GSAP Magnetic Hover — toti-web-design-skill</title>
  <link rel="stylesheet" href="../../tokens/base.css">
  <link rel="stylesheet" href="../../tokens/dark.css">
  <link rel="stylesheet" href="../../tokens/fluid-type.css">
  <link rel="stylesheet" href="../../tokens/fluid-spacing.css">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: var(--font-body); background: var(--color-bg); color: var(--color-text); display: flex; align-items: center; justify-content: center; min-height: 100vh; gap: var(--space-lg); flex-wrap: wrap; -webkit-font-smoothing: antialiased; }
    .magnetic-btn { display: inline-flex; align-items: center; justify-content: center; padding: var(--space-md) var(--space-xl); font-size: var(--font-size-base); font-weight: var(--weight-medium); color: var(--color-text-primary); background: var(--color-surface); border: 1px solid var(--color-border-strong); border-radius: var(--radius-full); cursor: pointer; will-change: transform; }
    .magnetic-btn span { display: inline-block; will-change: transform; }
  </style>
</head>
<body>
  <button class="magnetic-btn" id="btn1"><span>Hover Me</span></button>
  <button class="magnetic-btn" id="btn2"><span>Me Too</span></button>
  <button class="magnetic-btn" id="btn3"><span>And Me</span></button>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
  <script>
    const prefersReducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    if (!prefersReducedMotion) {
      document.querySelectorAll('.magnetic-btn').forEach((btn) => {
        const text = btn.querySelector('span');
        btn.addEventListener('mousemove', (e) => {
          const rect = btn.getBoundingClientRect();
          const x = e.clientX - rect.left - rect.width / 2;
          const y = e.clientY - rect.top - rect.height / 2;
          gsap.to(btn, { x: x * 0.4, y: y * 0.4, duration: 0.4, ease: 'power3.out' });
          gsap.to(text, { x: x * 0.2, y: y * 0.2, duration: 0.4, ease: 'power3.out' });
        });
        btn.addEventListener('mouseleave', () => {
          gsap.to(btn, { x: 0, y: 0, duration: 0.6, ease: 'elastic.out(1, 0.3)' });
          gsap.to(text, { x: 0, y: 0, duration: 0.6, ease: 'elastic.out(1, 0.3)' });
        });
      });
    }
  </script>
</body>
</html>

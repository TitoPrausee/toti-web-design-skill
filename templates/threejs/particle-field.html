<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Three.js Particle Field — toti-web-design-skill</title>
  <link rel="stylesheet" href="../../tokens/base.css">
  <link rel="stylesheet" href="../../tokens/dark.css">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: var(--color-bg); color: var(--color-text); font-family: var(--font-body); overflow: hidden; }
    #canvas { position: fixed; inset: 0; z-index: 0; }
    .content { position: relative; z-index: 1; min-height: 100vh; display: flex; align-items: center; justify-content: center; flex-direction: column; gap: var(--space-md); text-align: center; padding: var(--container-padding); }
    .content h1 { font-family: var(--font-display); font-size: var(--font-size-display); font-weight: var(--weight-bold); color: var(--color-text-primary); mix-blend-mode: difference; }
    .content p { font-size: var(--font-size-lg); color: var(--color-text-muted); max-width: 50ch; mix-blend-mode: difference; }
  </style>
</head>
<body>
  <canvas id="canvas"></canvas>
  <div class="content"><h1 data-text-reveal="words">Particle Field</h1><p>Three.js particle system reacting to mouse movement.</p></div>
  <script type="importmap">
    { "imports": { "three": "https://cdn.skypack.dev/three" } }
  </script>
  <script type="module">
    import * as THREE from 'three';
    const prefersReducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    const canvas = document.getElementById('canvas');
    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
    const renderer = new THREE.WebGLRenderer({ canvas, alpha: true, antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    const particleCount = 2000;
    const positions = new Float32Array(particleCount * 3);
    const colors = new Float32Array(particleCount * 3);
    const accentColor = new THREE.Color(0x578bfc);
    const ctaColor = new THREE.Color(0x00fe40);
    for (let i = 0; i < particleCount; i++) {
      positions[i * 3] = (Math.random() - 0.5) * 20;
      positions[i * 3 + 1] = (Math.random() - 0.5) * 20;
      positions[i * 3 + 2] = (Math.random() - 0.5) * 20;
      const c = Math.random() > 0.5 ? accentColor : ctaColor;
      colors[i * 3] = c.r; colors[i * 3 + 1] = c.g; colors[i * 3 + 2] = c.b;
    }
    const geometry = new THREE.BufferGeometry();
    geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
    geometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));
    const material = new THREE.PointsMaterial({ size: 0.05, vertexColors: true, transparent: true, opacity: 0.8, blending: THREE.AdditiveBlending });
    const particles = new THREE.Points(geometry, material);
    scene.add(particles);
    camera.position.z = 8;
    let mouseX = 0, mouseY = 0;
    window.addEventListener('mousemove', (e) => { mouseX = (e.clientX / window.innerWidth) * 2 - 1; mouseY = -(e.clientY / window.innerHeight) * 2 + 1; });
    function animate() {
      requestAnimationFrame(animate);
      if (!prefersReducedMotion) {
        particles.rotation.y += 0.0005; particles.rotation.x += 0.0003;
        camera.position.x += (mouseX * 0.5 - camera.position.x) * 0.05;
        camera.position.y += (mouseY * 0.5 - camera.position.y) * 0.05;
        camera.lookAt(scene.position);
      }
      renderer.render(scene, camera);
    }
    animate();
    window.addEventListener('resize', () => { camera.aspect = window.innerWidth / window.innerHeight; camera.updateProjectionMatrix(); renderer.setSize(window.innerWidth, window.innerHeight); });
  </script>
  <script src="../../animations/text-reveal.js"></script>
</body>
</html>

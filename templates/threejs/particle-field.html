<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Three.js Particle Field</title>
  <link rel="stylesheet" href="../../tokens/base.css">
  <link rel="stylesheet" href="../../tokens/dark.css">
  <style>
    .particle-field { position: relative; width: 100%; height: 100vh; overflow: hidden; background: var(--color-bg, #0a0a0a); }
    .particle-field__canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
    .particle-field__content { position: relative; z-index: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100%; text-align: center; pointer-events: none; }
    .particle-field__title { font-size: var(--font-size-6xl, 4.77rem); font-weight: 900; letter-spacing: -0.04em; color: var(--color-text, #f5f5f5); }
    @media (prefers-reduced-motion: reduce) { .particle-field__canvas { display: none; } }
  </style>
</head>
<body>
  <section class="particle-field">
    <canvas class="particle-field__canvas" aria-hidden="true"></canvas>
    <div class="particle-field__content"><h1 class="particle-field__title">Infinite</h1></div>
  </section>
  <script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js"}}</script>
  <script type="module">
    import * as THREE from 'three';
    const prefersReducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    const canvas = document.querySelector('.particle-field__canvas');
    const container = document.querySelector('.particle-field');
    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(75, container.clientWidth / container.clientHeight, 0.1, 1000);
    camera.position.z = 50;
    const renderer = new THREE.WebGLRenderer({ canvas, alpha: true, antialias: true });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.setSize(container.clientWidth, container.clientHeight);
    const count = 3000;
    const positions = new Float32Array(count * 3);
    const colors = new Float32Array(count * 3);
    const sizes = new Float32Array(count);
    const accent = new THREE.Color(0x578bfc);
    const cta = new THREE.Color(0x00fe40);
    for (let i = 0; i < count; i++) {
      const i3 = i * 3; const r = Math.random() * 80 + 20; const theta = Math.random() * Math.PI * 2; const phi = Math.acos(Math.random() * 2 - 1);
      positions[i3] = r * Math.sin(phi) * Math.cos(theta); positions[i3+1] = r * Math.sin(phi) * Math.sin(theta); positions[i3+2] = r * Math.cos(phi);
      const c = accent.clone().lerp(cta, Math.random()); colors[i3] = c.r; colors[i3+1] = c.g; colors[i3+2] = c.b; sizes[i] = Math.random() * 2 + 0.5;
    }
    const geo = new THREE.BufferGeometry();
    geo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
    geo.setAttribute('color', new THREE.BufferAttribute(colors, 3));
    geo.setAttribute('size', new THREE.BufferAttribute(sizes, 1));
    const mat = new THREE.ShaderMaterial({
      uniforms: { uTime: { value: 0 }, uPixelRatio: { value: renderer.getPixelRatio() } },
      vertexShader: 'attribute float size; attribute vec3 color; varying vec3 vColor; uniform float uTime; uniform float uPixelRatio; void main() { vColor = color; vec3 pos = position; pos.y += sin(uTime * 0.5 + position.x * 0.1) * 2.0; vec4 mv = modelViewMatrix * vec4(pos, 1.0); gl_PointSize = size * uPixelRatio * (300.0 / -mv.z); gl_Position = projectionMatrix * mv; }',
      fragmentShader: 'varying vec3 vColor; void main() { float d = length(gl_PointCoord - vec2(0.5)); if (d > 0.5) discard; gl_FragColor = vec4(vColor, (1.0 - smoothstep(0.0, 0.5, d)) * 0.8); }',
      transparent: true, depthWrite: false, blending: THREE.AdditiveBlending
    });
    const points = new THREE.Points(geo, mat); scene.add(points);
    let tx = 0, ty = 0;
    if (!prefersReducedMotion) {
      container.addEventListener('mousemove', e => { const r = container.getBoundingClientRect(); tx = ((e.clientX - r.left) / r.width - 0.5) * 0.3; ty = ((e.clientY - r.top) / r.height - 0.5) * 0.3; });
      window.addEventListener('resize', () => { camera.aspect = container.clientWidth / container.clientHeight; camera.updateProjectionMatrix(); renderer.setSize(container.clientWidth, container.clientHeight); });
      let visible = true; const obs = new IntersectionObserver(e => { visible = e[0].isIntersecting; }); obs.observe(container);
      const clock = new THREE.Clock();
      (function loop() { requestAnimationFrame(loop); if (!visible) return; const t = clock.getElapsedTime(); mat.uniforms.uTime.value = t; camera.rotation.y += (tx - camera.rotation.y) * 0.05; camera.rotation.x += (ty - camera.rotation.x) * 0.05; points.rotation.y = t * 0.05; renderer.render(scene, camera); })();
    } else { renderer.render(scene, camera); }
  </script>
</body>
</html>
